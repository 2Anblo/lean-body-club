# Render Blueprint for the API: Render dashboard → New → Blueprint → pick this repo.
# The database is MongoDB Atlas (free M0 cluster); paste its connection string as MONGODB_URI
# when Render asks. Then point the client at it (README → "Pointing the live site at the real backend").
services:
  - type: web
    name: lean-body-club-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    # Fills an empty database with the demo data once; never wipes existing data.
    startCommand: npm run seed -- --if-empty && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        value: https://2anblo.github.io,http://localhost:5173
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: AUTH_RATE_LIMIT
        value: "20"
      - key: BCRYPT_ROUNDS
        value: "11"
