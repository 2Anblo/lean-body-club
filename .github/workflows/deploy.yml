name: Deploy

# Publishes the client to GitHub Pages: https://<owner>.github.io/<repo>/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Repo Settings → Secrets and variables → Actions → Variables:
      #   VITE_API_MODE = http, VITE_API_URL = https://<backend>/api  (once the backend is deployed)
      # Without them the site runs on the in-browser demo data.
      - name: Build for GitHub Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_API_MODE: ${{ vars.VITE_API_MODE || 'mock' }}
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      # Pages has no server-side routing: serve the app for unknown paths so deep links work.
      - name: Add single-page-app fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
